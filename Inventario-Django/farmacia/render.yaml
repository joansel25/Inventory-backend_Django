databases:
  - name: farmacia_db
    databaseName: inventario_farmacia
    user: farmacia_user

services:
  - type: web
    name: farmacia-backend
    rootDir: farmacia
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn farmacia.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: farmacia_db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com localhost 127.0.0.1"